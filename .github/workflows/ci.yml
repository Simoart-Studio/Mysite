name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, audyt, build, testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Instalacja (lockfile, bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audyt zależności produkcyjnych (blokuje High/Critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Przeglądarka do testów
        run: npx playwright install --with-deps chromium
      - name: Testy (unit + E2E desktop/mobile)
        run: npm test
      - name: SBOM (CycloneDX)
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raporty-${{ github.sha }}
          path: |
            playwright-report/
            sbom.cdx.json
          retention-days: 14

  secrets:
    name: Skan sekretów (gitleaks, cała historia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
