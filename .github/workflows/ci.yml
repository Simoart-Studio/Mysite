name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, audyt, build, testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Instalacja (lockfile, bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audyt zależności produkcyjnych (blokuje High/Critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Przeglądarka do testów
        run: npx playwright install --with-deps chromium
      - name: Testy (unit + E2E desktop/mobile)
        run: npm test
      - name: SBOM (CycloneDX)
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: raporty-${{ github.sha }}
          path: |
            playwright-report/
            sbom.cdx.json
          retention-days: 14

  secrets:
    name: Skan sekretów (gitleaks, cała historia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action v2 wymaga płatnej licencji dla repozytoriów organizacji — zamiast niej darmowe CLI
      # (MIT), przypięte do wersji i sumy SHA-256 (podmieniony plik nie zostanie uruchomiony).
      - name: Gitleaks (CLI) — skan całej historii
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
